function renderTk(){const el=$('tkW');if(!el)return;const h=COINS.map(c=>{const d=prices[c.sym];if(!d)return'<span class="tk-i"><span class="s">'+c.name+'</span><span class="p">...</span></span>';const up=parseFloat(d.ch)>=0;return'<span class="tk-i"><span class="s">'+c.name+'</span><span class="p">'+fmtP(d.pr)+'</span><span class="'+(up?'u':'d')+'">'+(up?'↑':'↓')+fmtCh(d.ch)+'</span></span>'}).join('');el.innerHTML=h+h}

// PRICE CARDS
function renderLP(){const el=$('lpG');if(!el)return;const r=gR(),t=L[CL],bw=t.lp_buy||'Buy';

function selTf(t){chTf=t;document.querySelectorAll('.ch-tf button').forEach(b=>b.classList.toggle('on',b.textContent===t));loadCh()}
function loadCh(){
const c=COINS.find(x=>x.sym===chSym);$('chName').textContent=c.full+' / USDT';
fetch('https://api.binance.com/api/v3/klines?symbol='+chSym+'&interval='+chTf+'&limit=120')
.then(r=>r.json()).then(data=>{
chData=data.map(d=>({t:d[0],o:+d[1],h:+d[2],l:+d[3],c:+d[4],v:+d[5]}));
const last=chData[chData.length-1];const first=chData[0];
const chg=((last.c-first.o)/first.o*100);const up=chg>=0;
$('chPr').textContent=fmtP(last.c);
$('chChg').textContent=(up?'+':'')+chg.toFixed(2)+'%';
$('chChg').className='chg '+(up?'u':'d');
drawChart()}).catch(()=>{})}

function drawChart(){
const cv=$('chCv');if(!cv||!chData.length)return;
const dpr=window.devicePixelRatio||1;const rect=cv.getBoundingClientRect();
cv.width=rect.width*dpr;cv.height=rect.height*dpr;
const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
const W=rect.width,H=rect.height,pad={t:8,r:60,b:24,l:8};
const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
const hi=Math.max(...chData.map(d=>d.h)),lo=Math.min(...chData.map(d=>d.l));
const range=hi-lo||1;
const bw=Math.max(1,(cW/chData.length)-1.5);

ctx.clearRect(0,0,W,H);
// Grid
ctx.strokeStyle='rgba(255,255,255,.04)';ctx.lineWidth=1;
for(let i=0;i<5;i++){const y=pad.t+cH*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(W-pad.r,y);ctx.stroke();
ctx.fillStyle='rgba(255,255,255,.25)';ctx.font='9px "DM Mono"';ctx.textAlign='right';
ctx.fillText(fmtP(hi-range*i/4),W-pad.r+52,y+3)}

chData.forEach((d,i)=>{
const x=pad.l+(i/chData.length)*cW+bw/2;
const oY=pad.t+((hi-d.o)/range)*cH;
const cY=pad.t+((hi-d.c)/range)*cH;
const hY=pad.t+((hi-d.h)/range)*cH;
const lY=pad.t+((hi-d.l)/range)*cH;
const up=d.c>=d.o;
const clr=up?'#4ade80':'#f87171';
// Wick
ctx.strokeStyle=clr;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,hY);ctx.lineTo(x,lY);ctx.stroke();
// Body
ctx.fillStyle=clr;
const bodyTop=Math.min(oY,cY);const bodyH=Math.max(Math.abs(cY-oY),1);
ctx.fillRect(x-bw/2,bodyTop,bw,bodyH)})
}
window.addEventListener('resize',drawChart);
