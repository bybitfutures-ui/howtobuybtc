{id:'e2',name:'OKX 欧易',desc:'现货Maker手续费0.08%为三家最低。Web3钱包功能最丰富，支持多链DeFi/NFT。内置模拟交易适合新手练习。',pk:'Maker 0.08%,Web3钱包最强,模拟交易,多链支持',link:'',icon:'OKX',color:'#ffffff',ep:1},

let prices={};

// TICKER + PRICE CARDS (from admin coins)
function renderTk(){const el=$('tkW');if(!el)return;const coins=gCn();const h=coins.map(c=>{const d=prices[c.sym];if(!d)return'<span class="tki"><span class="s">'+c.name+'</span><span class="p">...</span></span>';const up=parseFloat(d.ch)>=0;return'<span class="tki"><span class="s">'+c.name+'</span><span class="p">'+fmtP(d.pr)+'</span><span class="'+(up?'u':'d')+'">'+(up?'↑':'↓')+fmtCh(d.ch)+'</span></span>'}).join('');el.innerHTML=h+h}

function calcMA(data,period){return data.map((_,i)=>{if(i<period-1)return null;let sum=0;for(let j=i-period+1;j<=i;j++)sum+=data[j].c;return sum/period})}

function drawCh(){
const cv=$('chCv');if(!cv||!chData.length)return;
const dpr=window.devicePixelRatio||1,rect=cv.getBoundingClientRect();
cv.width=rect.width*dpr;cv.height=rect.height*dpr;
const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
const W=rect.width,H=rect.height;
const volH=showVol?H*0.18:0;
const p={t:8,r:56,b:volH+16,l:4},cW=W-p.l-p.r,cH=H-p.t-p.b;
const hi=Math.max(...chData.map(d=>d.h)),lo=Math.min(...chData.map(d=>d.l)),rng=hi-lo||1;
const bw=Math.max(1,(cW/chData.length)-1.5);
